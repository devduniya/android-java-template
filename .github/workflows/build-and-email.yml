name: Build and Email

# Builds this Android app and emails a download link. Only runs on
# pushes to the `deployment` branch — see README.md for the full flow.

on:
  push:
    branches: [ deployment ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which variant(s) to build. 'both' skips release gracefully if signing secrets are missing."
        required: true
        default: both
        type: choice
        options: [debug, release, both]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'both' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check release signing availability
        id: signing_check
        if: env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KS" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$KS_PW" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "$KEY_PW" ] && missing+=("ANDROID_KEY_PASSWORD")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "::error::Release build requested but these repo secrets are not set: ${missing[*]}. Add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          echo "::warning::Release signing secrets are not set (missing: ${missing[*]}) — only the debug APK will be built and emailed this run. Add them to also get a signed release build."

      - name: Configure release signing
        if: steps.signing_check.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/release.keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "storeFile=${KEYSTORE_PATH}"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > "${GITHUB_WORKSPACE}/key.properties"

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug' || env.BUILD_TYPE == 'both'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: steps.signing_check.outputs.available == 'true' && (env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both')
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 7

  release-and-notify:
    name: Publish release and email
    needs: build-android
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build-output

      - name: Create GitHub Release
        if: needs.build-android.result == 'success'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: build-output/**
          body: |
            Automated build from commit ${{ github.sha }} on `${{ github.ref_name }}`.

      - name: Verify email configuration
        if: needs.build-android.result == 'success'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO || vars.MAIL_TO }}
        run: |
          missing=()
          [ -z "$RESEND_API_KEY" ] && missing+=("RESEND_API_KEY (Secret)")
          [ -z "$MAIL_TO" ] && missing+=("MAIL_TO (Secret or Variable)")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Build succeeded but can't email it: not set in this repo: ${missing[*]}. Add under Settings > Secrets and variables > Actions. MAIL_TO can be either a Secret or a Variable (Secret is checked first, Variable is used only if no Secret is set) — Variable is fine since it's just a recipient address; RESEND_API_KEY must be a Secret since it's a real credential."
            exit 1
          fi

      - name: Email the build
        if: needs.build-android.result == 'success'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO || vars.MAIL_TO }}
        run: |
          TAG="build-${{ github.run_number }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          LINKS_HTML=""
          while IFS= read -r f; do
            NAME=$(basename "$f")
            URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${NAME}"
            case "$NAME" in
              *debug*) LABEL="Debug build" ;;
              *release*) LABEL="Release build" ;;
              *) LABEL="Build" ;;
            esac
            LINKS_HTML="${LINKS_HTML}<li><b>${LABEL}:</b> <a href=\"${URL}\">${NAME}</a></li>"
          done < <(find build-output -type f | sort)

          curl -fsS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg to "$MAIL_TO" \
              --arg url "$RELEASE_URL" \
              --arg repo "${{ github.repository }}" \
              --arg sha "${{ github.sha }}" \
              --arg branch "${{ github.ref_name }}" \
              --arg links "$LINKS_HTML" \
              '{
                from: "Build Bot <onboarding@resend.dev>",
                to: [$to],
                subject: ("Build succeeded: " + $repo),
                html: ("<p>A new build finished successfully.</p><ul><li>Repo: " + $repo + "</li><li>Branch: " + $branch + "</li><li>Commit: " + $sha + "</li></ul><p><b>Downloads:</b></p><ul>" + $links + "</ul><p><a href=\"" + $url + "\">View the full release</a></p>")
              }')"
